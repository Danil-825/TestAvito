<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Авито</title>
</head>
<body>
<h3>Редактирование пользователя <span th:text="${user.name}">Имя</span></h3>

<form th:action="@{/admin/user/edit}" method="post">
    <div th:each="roles : ${role}">
        <label>
            <input type="checkbox"
                   th:name="${roles}"
                   th:value="${roles}"
                   th:checked="${#lists.contains(user.role, roles)}">
            <span th:text="${roles}">Роль</span>
        </label>
    </div>

    <input type="hidden" th:name="userId" th:value="${user.id}">
    <input type="hidden" th:name="_csrf" th:value="${_csrf.token}">
    <button type="submit">Сохранить</button>
</form>
</body>
</html>
