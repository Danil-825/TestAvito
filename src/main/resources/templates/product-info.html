<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Информация о товаре</title>
</head>
<body>
<h1>Информация о товаре</h1>

<div th:each="image : ${product.images}">
    <img th:src="@{'/images/' + ${image.id}}"
         th:alt="${image.originalFilename}"
         height="200px"/>
    <br><br>
</div>

<p><b>Название:</b> <span th:text="${product.name}"></span></p>
<p><b>Описание:</b> <span th:text="${product.description}"></span></p>
<p><b>Цена:</b> <span th:text="${product.price} + ' руб.'"></span></p>
<p><b>Город:</b> <span th:text="${product.city}"></span></p>
<p><b>Автор:</b> <a th:href="@{/user/{id}(id=${product.user.id})}" th:text="${product.user.name}"></a></p><p><b>Номер телефона:</b> <span th:text="${product.user?.phoneNumber} ?: 'не указан'"></span></p>

<br>
<a href="/">Вернуться на главную</a>
</body>
</html>
